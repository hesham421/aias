# ════════════════════════════════════════════════════════════════════════════
# profiles/aias.yaml — the Request Verification Service as DATA
# ----------------------------------------------------------------------------
# Filled from profiles/aias/knowledge/raw-idea.md (2026-10-01). Values marked
# ASSUMPTION are not stated in the raw idea and were chosen as the conventional
# answer; correct them here, never in a generated artifact. The raw idea's §13
# "Open" items are deliberately NOT answered here; caller auth is deferred (raw-idea A2).
# Validated by profiles/_schema.yaml.
# ════════════════════════════════════════════════════════════════════════════
schema_version: 6

identity:
  id: aias
  display: Request Verification Service
  description: >-
    Standalone backend service that verifies a government service request before an
    employee approves it — runs the service's configured read-only queries, fetches and
    reads the attached documents, compares them with the service's conditions, and
    returns a stored, evidence-backed compliance report. The employee stays the decision maker.

languages:
  all: [en, ar]                     # ASSUMPTION: the raw idea is English; Arabic is the employees' language
  primary: en
  require_all: false                # artifacts in English; Arabic where an employee-facing text needs it

vocabulary:
  module_prefixes:                  # raw-idea §14 — the proposed split, for domain-profile to confirm
    REG: Service Registry
    CHK: Check Engine
    DOC: Document Access
    RPT: Report Store
    INT: Host Integration
  keyword_map:
    REG: [service package, service definition, service.yaml, knowledge.md, connection, version, registry]
    CHK: [check, pipeline, deterministic check, LLM comparison, compliance, condition, finding]
    DOC: [document, attachment, path, blob, manual upload, PDF, XLS, image, OCR, vision]
    RPT: [report, run, finding, evidence, employee decision, retention, CHECK_RUN]
    INT: [REST, host system, ADF, report page, view, approval API, decision, polling]
  entity_kinds: [config, transactional]   # config = registry data (packages, connections); transactional = runs and their children
  glossary:
    Check: One independent verification run of one request against one service package; nothing is carried from one check to another.
    Service Package: The per-service configuration — a knowledge file plus a structured definition — maintained by the service administrator, versioned; adding a service needs no code.
    Service Knowledge: The natural-language conditions and rules of a service, read whole by the LLM (no retrieval).
    Service Definition: The structured part of a service package — queries, required documents, fetch mode, optional approval API — executed literally by the engine, never interpreted by the LLM.
    Connection: A named data source defined once outside the service packages and set at activation time per environment.
    Fetch Mode: How a service's documents are obtained — path (storage path from the database), blob (database column over read-only JDBC) or manual (uploaded by the employee).
    Finding: The outcome of one condition in a report — satisfied or not, its evidence and a note for the employee.
    Evidence: The actual value found that a finding is based on, shown so the employee can verify it.
    Overall Status: The report's verdict — COMPLIANT, NOT_COMPLIANT or NEEDS_MANUAL_REVIEW; a missing or unreadable required document prevents COMPLIANT.
    Host System: The calling application (Oracle ADF or another government system) that starts checks, shows the report and owns the user interface.
    Employee Decision: The approve/reject decision the employee takes, recorded beside the report result.
    Approval API: An optional, per-service host endpoint the service calls only after the employee confirms a decision.
  glossary_synonyms:
    Check: [job, audit, scan]
    Service Package: [plugin, template, tenant]
    Finding: [issue, violation]
    Employee Decision: [verdict]
  bounded_contexts:
    - {id: configuration, owns: [REG]}
    - {id: verification,  owns: [CHK, DOC]}
    - {id: record,        owns: [RPT]}
    - {id: integration,   owns: [INT]}

tracks:
  backend:
    plans:
      exec:
        phases:
          - {key: CORE,      display: CORE,          never_split: true, no_tests: true}   # project skeleton, configuration, limits (timeout / rows / file size)
          - {key: DATA-DOM,  display: DATA+DOM,      sub_labels: [CONFIG, TRANSACTIONAL], no_tests: true}
          - {key: PORTS,     display: PORTS+ADAPTERS, sub_labels: [QUERY, DOCUMENT, MODEL]}  # QueryExecutor (MCP), DocumentFetcher/readers, ChatModel + vision — each behind an interface (raw-idea §3, §6, §10)
          - {key: SVC-API,   display: SVC+API,       split_threshold: {kind: API, count: 8, op: ">=", grouping: "COMMAND / QUERY / VIEW"}, sub_labels: [COMMAND, QUERY, VIEW]}
          # no SEC-BE phase: caller authentication is deferred (raw-idea A2); the §12 guardrails live in the
          # phases that own them (PORTS, SVC-API) and are scored by review.extra_checks AIAS-3..8
          - {key: ALIGN-BE,  display: ALIGN-BE,      never_split: true, no_tests: true}
          - {key: CROSS-MOD, display: CROSS-MODULE,  integration: true}   # LAST: one block per XM edge, one package each (factory.yaml → integration)
      test:
        phases:
          - {key: TEST-PLAN-BE, split_threshold: {kind: TC, count: 12, op: ">", grouping: "RULE-SCENARIOS / API-SCENARIOS / MODEL-EVAL"}, sub_labels: [RULE-SCENARIOS, API-SCENARIOS, MODEL-EVAL]}   # MODEL-EVAL: the fixed known-result request set run on every model change (raw-idea §10)
          - {key: INT-XM,       display: INT-XM,     integration: true, split_threshold: {kind: TC, count: 8, op: ">", grouping: "per target module"}}
  frontend:                         # raw-idea A1: the employee frontend, embedded in the host screen
    plans:
      exec:
        phases:                     # one SUB per screen (sub_bearing); no SEC-FE — security deferred (raw-idea A2)
          - {key: F1, binds_api: true, display: "F1 — Models & Types",     sub_bearing: true}
          - {key: F2, binds_api: true, display: "F2 — Data Hooks",         sub_bearing: true}
          - {key: F3, binds_api: true, display: "F3 — Forms & Validators", sub_bearing: true}
          - {key: F4,                  display: "F4 — Screens & Routes",   sub_bearing: true}
          - {key: ALIGN-FE, never_split: true, no_tests: true}
      test:
        phases:
          - {key: TEST-PLAN-FE, split_threshold: {kind: TC, count: 8, op: ">", grouping: "UI-FLOWS / INT-FLOW"}, sub_labels: [UI-FLOWS, INT-FLOW]}
          - {key: INT-UXD,      display: INT-UXD, integration: true, split_threshold: {kind: TC, count: 8, op: ">", grouping: "per source module"}}

stack:
  db:                               # the service's OWN schema (runs, findings, documents) — not the host data,
                                     # which is reached read-only through MCP and is never generated here
    dialects: [oracle19c]           # ASSUMPTION: same Oracle estate as the host systems; version to confirm
    target_dialect: oracle19c
    pk_generation: identity         # greenfield schema owned by the service — no legacy sequences to follow
    delete_semantics: hard          # reports are records, never deactivated; rows leave only by the retention purge (period: §13 Open)
    required_marker: NOT NULL
    naming:
      audit_fields: [createdAt, updatedAt]
      pk_pattern: "{entity}Id"
    syntax_map:
      identity:   {oracle19c: "GENERATED BY DEFAULT AS IDENTITY"}
      pk:         {oracle19c: "NUMBER(19)"}
      string:     {oracle19c: "VARCHAR2(n CHAR)"}
      boolean:    {oracle19c: "NUMBER(1)"}
      timestamp:  {oracle19c: "TIMESTAMP WITH TIME ZONE"}
      decimal:    {oracle19c: "NUMBER(p,s)"}
      text:       {oracle19c: "CLOB"}
      json:       {oracle19c: "CLOB CHECK (col IS JSON)"}
  backend:
    framework: spring-boot-4-java-21     # + Spring AI 2.0 (raw-idea §13 Decided)
    api:
      base_path: "/api/v1/{resource}"    # one service, so no module segment; final paths are P3.1's (raw-idea §0)
      verbs: {POST: "create (start a check, upload documents, record a decision)", GET: read}   # no update or delete is exposed
      error_envelope: "ProblemDetail (RFC 9457) → {type, title, status, detail, code}"
      error_code_format: "{MOD}-{http}[-{SLUG}]"   # e.g. CHK-404-RUN-NOT-FOUND ; {SLUG} = SCREAMING-KEBAB
      http_statuses: [200, 201, 202, 400, 401, 403, 404, 409, 413, 415, 422, 500, 502, 504]
                                         # 202: a check is accepted and runs asynchronously (raw-idea §5);
                                         # 502/504: the host approval API failed / timed out at decision time
      # auth: intentionally not declared — caller authentication is deferred (raw-idea A2)
    layers: [controller, service, domain, port, adapter, repository]   # every external dependency is a port with a replaceable adapter
  frontend:
    framework: react-ts-vite             # raw-idea A1; same stack as the owner's other platform
    libraries:
      routing: react-router
      server-state: tanstack-query       # also drives polling of a running check (raw-idea §5)
      forms: react-hook-form
      validation: zod
    lazy_chunk_per: screen
  mobile:
    framework: NONE
  testing:
    backend: agnostic                    # the test stage emits framework-neutral TC specs
    frontend: agnostic

conventions:
  entity_defaults:
    transactional: [createdAt, updatedAt]
  identifiers: >-
    Every table of the service's own schema keys on NUMBER(19) GENERATED BY DEFAULT AS IDENTITY.
    Host-system identifiers (service request number, employee identity) are stored as strings exactly
    as the host sent them and are never foreign keys — the host data lives outside this schema.
  lookups: >-
    Overall status (COMPLIANT | NOT_COMPLIANT | NEEDS_MANUAL_REVIEW), fetch mode (path | blob | manual)
    and document read status are closed enums owned by the service; service codes come only from the
    service registry and are never hardcoded.
  workflow_engine: forbidden             # the check pipeline is fixed code (raw-idea §5)
  module_interface: in_process           # one deployable: REG/CHK/DOC/RPT/INT reach each other through injected interfaces
  domain_behaviour_placement: domain_classes   # consistent with `domain` as its own layer
  screen_composition: true               # one screen, one job, one submit — e.g. upload and decision never share a save

plan_vocabulary:
  request_line: Request
  effect_line: Orchestration
  operations_line: OPERATIONS
  screen_operations_line: Operations
  screen_subjects_line: Entities
  operation_separators: [",", ";", "/", "·"]
  exclusion_reasons: [system-generated, derived, DEFERRED]

declared_totals:
  - {artifact: backend-execution-plan, kind: DBF, rows_in: db-script}
  - {artifact: backend-execution-plan, kind: XM,  rows_in: db-script}
  - {artifact: backend-execution-plan, kind: API}
  - {artifact: backend-execution-plan, kind: QR}

self_check:
  block: ALIGN

knowledge:
  files:
    - profiles/aias/knowledge/raw-idea.md   # the owner's raw idea — §13 Decided is locked input

review:
  extra_checks:                          # raw-idea §12 guardrails, made gate-scored
    - {id: AIAS-1, stage: P1,   check: "every guardrail of raw-idea §12 is a REQ with at least one AC, and no §13 Decided point (as amended in §15) is reopened", severity: CRITICAL}
    - {id: AIAS-2, stage: P1,   check: "no requirement introduces multi-tenancy, conversation memory, RAG/vector store, multi-agent orchestration, a full administration UI, or caller authentication (deferred, raw-idea A2)", severity: MAJOR}
    - {id: AIAS-3, stage: P3.1, check: "the LLM is given no tool that runs SQL or triggers approval; queries run only through the query port from the service definition", severity: CRITICAL}
    - {id: AIAS-4, stage: P3.1, check: "the approval API is invoked only from the employee-decision operation, and only where the service enables it", severity: CRITICAL}
    - {id: AIAS-5, stage: P3.1, check: "query parameters are bound or strictly type-validated, and every file path is validated inside the allowed storage root before opening", severity: CRITICAL}
    - {id: AIAS-6, stage: P3.1, check: "document content reaches the model only as delimited data, never as instructions", severity: CRITICAL}
    - {id: AIAS-7, stage: P3.1, check: "every check declares its timeout, maximum rows and maximum file size", severity: MAJOR}
    - {id: AIAS-8, stage: P3.1, check: "a missing or unreadable required document appears in the report and prevents COMPLIANT — never skipped silently", severity: MAJOR}
    - {id: AIAS-9, stage: P3.1, check: "the engine depends on Spring AI ChatModel only — no provider-specific feature — and document reading uses its own configurable model", severity: MAJOR}
    - {id: AIAS-10, stage: P4,  check: "a MODEL-EVAL set of requests with known expected results exists and is named as acceptance for model changes", severity: MAJOR}
    - {id: AIAS-11, stage: P3.2, check: "every screen shows a finding's evidence beside it, and a report with a missing or unreadable required document is never displayed as COMPLIANT", severity: MAJOR}
